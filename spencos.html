<!DOCTYPE html>
<html dset_theme="dark">
    <head>
        <title>SpencOS</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <link rel="stylesheet" href="global/css/universal.css">
        <link rel="stylesheet" href="global/css/card.css">
        <link rel="stylesheet" href="spencos/css/system.css">
        <link rel="stylesheet" href="spencos/css/apps.css">
        <link rel="stylesheet" href="global/css/posts.css">
        <link rel="shortcut icon" type="image/x-icon" href="global/media/icons/logos/tree.webp">
    </head>
    <body>
        <!--Visual Effects-->
        <div id="nightlight"></div>

        <!--Animation Div-->
        <div id="content">

            <!--Start Menu stored here-->
            <div id="start">
                <h1>Dashboard</h1>
                <ul id="startIcons" onclick="clickDesktop()">
                </ul>

                <div id="startBottom">
                    <div id="startUser"><img src="spencos/media/user.png"><span>You</span></div>
                    <a id="buttonLogout" onclick="shutdown()">Logout</a>
                </div>
            </div>

            <!--Notifications stored here-->
            <div id="notify">
                <h1>Notifications</h1>
                <img src="spencos/media/cat.gif" class="viewable">
                <h2>Nothing to see here~</h2>
            </div>

            <div id="ccenter">
                <h1>Action Center</h1>
                <ul id="startIcons" class="typeCCenter">
                    <li onclick="changeSetting('audio')"><img class="audioIcon invert">Audio</li>
                    <li onclick="document.getElementById('switchTheme').click()"><img src="spencos/media/icons/theme.png" class="invert">Theme</li>
                    <li onclick="appFunction('Settings', 'open'); uiFunction('CCenter')"><img src="spencos/media/apps/SettingsIcon.webp" class="invert">Settings</li>
                    <li onclick="document.getElementById('test').click()"><img src="seal/local/media/wallpaperSet.png" class="invert">Wallpaper</li>
                    <li onclick="clearBackground()"><img src="seal/local/media/wallpaperClear.png" class="invert">Clear WP</li>
                </ul>
            </div>

            <!--Desktop, Holds Wallpaper and Apps-->
            <div id="desktop" onclick="clickDesktop()">
                <!--Desktop selection box-->
                <div id="container">
                    <div id="selection">
                        
                    </div>
                </div>           
                <!--Desktop icons-->

                <!--Apps are stored here-->
                <div id="apps" class="apps">
                    <div id="popups">

                    </div>
                </div>
            </div>

            <!--Taskbar, Holds Potential Apps-->
            <nav id="taskbar">
                <a id="startButton" onclick="uiFunction('Start')"><img src="global/media/icons/logos/tree.webp"></a>
                <div id="peekBar" onclick="uiFunction('Peek')"></div>
                <div id="navright" onclick="uiFunction('Notify')">
                    <h1 id="date-time"></h1>
                </div>
                <div id="statusBar" onclick="uiFunction('CCenter')">
                    <img src="spencos/media/icons/wifi.png" class="invert">
                    <img class="audioIcon invert">
                </div>
                <!-- <a id="Ska.SpaceIcon" draggable="true" onclick="appFunction('Ska.Space', 'toggle')" style="display: inline-flex;"><img src="spencos/media/apps/Ska.SpaceIcon.webp">Ska.Space</a> -->
            </nav>
        </div>

        <div id="shutdown">
            <div class="splashContent">
                <span class="loader"></span>
                <h1>Shutting Down</h1>
            </div>
        </div>
        <div id="splash">
            <img src="global/media/icons/logos/tree.webp" id="splashLogo">
            <h1 id="splashText">SpencOS</h1>
        </div>
    </body>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="spencos/system.js"></script>
    <script src="spencos/appengine.js"></script>
    
</html>
